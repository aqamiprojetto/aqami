specVersion: "0.1.0"
package:
  name: "aqami-escrow-example"
  version: "0.1.0"
  description: "Minimal escrow example for AQAMI foundation work."
cluster: "devnet"
programs:
  - name: "escrow"
    docs: "Escrow program for locked deposits and controlled release."
    accounts:
      - name: "Escrow"
        docs: "Holds escrow state for a depositor and beneficiary."
        fields:
          - name: "depositor"
            type: "pubkey"
          - name: "beneficiary"
            type: "pubkey"
          - name: "amount"
            type: "u64"
          - name: "status"
            type: "u8"
    pdas:
      - name: "escrow_pda"
        docs: "Deterministic escrow PDA derived from the depositor and beneficiary."
        seeds:
          - kind: "const"
            value: "escrow"
          - kind: "account_key"
            value: "depositor"
          - kind: "account_key"
            value: "beneficiary"
    instructions:
      - name: "create_escrow"
        docs: "Creates a new escrow agreement."
        accounts:
          - name: "depositor"
            role: "signer"
            isSigner: true
          - name: "beneficiary"
            role: "account"
          - name: "escrow"
            role: "account"
            accountType: "Escrow"
            isMut: true
            pda: "escrow_pda"
          - name: "system_program"
            role: "system_program"
        args:
          - name: "depositor"
            type: "pubkey"
          - name: "beneficiary"
            type: "pubkey"
          - name: "amount"
            type: "u64"
        emits:
          - "EscrowCreated"
        errors:
          - "InvalidAmount"
      - name: "release_escrow"
        docs: "Releases funds to the beneficiary."
        accounts:
          - name: "depositor"
            role: "signer"
            isSigner: true
          - name: "beneficiary"
            role: "account"
            isMut: true
          - name: "escrow"
            role: "account"
            accountType: "Escrow"
            isMut: true
            pda: "escrow_pda"
        args: []
        emits:
          - "EscrowReleased"
        errors:
          - "EscrowAlreadyReleased"
    events:
      - name: "EscrowCreated"
        fields:
          - name: "depositor"
            type: "pubkey"
          - name: "beneficiary"
            type: "pubkey"
          - name: "amount"
            type: "u64"
      - name: "EscrowReleased"
        fields:
          - name: "escrow"
            type: "pubkey"
    errors:
      - name: "InvalidAmount"
        code: 1000
        message: "Escrow amount must be greater than zero."
      - name: "EscrowAlreadyReleased"
        code: 1001
        message: "Escrow has already been released."
