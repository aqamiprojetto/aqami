[workspace]
members = [
  "crates/aqami-cli",
  "crates/aqami-spec"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6.1", features = ["derive"] }
jsonschema = { version = "0.46.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
yaml_serde = "0.10.4"
