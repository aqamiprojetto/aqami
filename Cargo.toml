[workspace]
members = [
  "crates/aqami-cli",
  "crates/aqami-codegen",
  "crates/aqami-runtime",
  "crates/aqami-spec"
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
heck = "0.5"
jsonschema = { version = "0.46.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-program = "4.0.0"
solana-program-test = { version = "4.0.0", features = ["agave-unstable-api"] }
solana-system-interface = "3.1.0"
tempfile = "3"
thiserror = "2"
yaml_serde = "0.10.4"
