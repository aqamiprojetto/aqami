name: Release Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo and target artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build aqami-cli in release mode
        run: cargo build --locked -p aqami-cli --release

      - name: Package release binary
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/aqami-cli dist/aqami-cli-linux-x86_64

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqami-cli-linux-x86_64
          path: dist/aqami-cli-linux-x86_64
